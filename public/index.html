<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PDF4YOU | Online Word To PDF</title>
  <link rel="icon" href="/logo.png">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Kavoon&display=swap"
        rel="stylesheet">  <!-- New Font Header -->

  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="/styles.css">

</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

    <div class="topbar-left">

      <h1 class="topbar-logo">
        PDF4YOU
      </h1>

    </div>

    <div class="topbar-right">

      <button class="auth-btn login-btn">
        Login
      </button>

      <button class="auth-btn signup-btn">
        Sign Up
      </button>

    </div>

  </header>

  <div class="container">

    <h2 class="logo">Word to PDF</h2>

    <form id="uploadForm">

      <input type="file"
             id="fileInput"
             name="word"
             accept=".docx"
             style="display:none;" />

      <div id="dropZone" class="upload-box">

        <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>

        <p>Drag & Drop DOCX here</p>
        <p>or click to select</p>

      </div>

      <p id="fileName"></p>

      <button class="btn" type="submit">Convert to PDF</button>

      <div id="loading" class="loading-box">
        <div class="spinner"></div>
        <p id="loadingText">Uploading...</p>
      </div>

      <progress id="progressBar" value="0" max="100"></progress>

      <div id="success" class="success">
        ✔ Converted Successfully
      </div>

      <a id="downloadBtn" class="download-btn">
        Download PDF
      </a>

    </form>

  </div>

  <footer class="trademark">
    © 2026 PDF4YOU™ | All Rights Reserved
  </footer>

  <script src="/app.js"></script>

</body>

</html>
